# OpenReply para TuGaterapeuta — todo en una VM Oracle Cloud Always Free.
#
# Servicios: web (Next.js), worker (envía DMs), cron (refresh de tokens y
# attach-next-reel), postgres, redis, caddy (HTTPS automático) y backup diario.
#
# Postgres y Redis viven en la VM y NO se exponen a internet: solo la red
# interna de Docker los ve. Así no hace falta TLS en Redis ni hay límite de
# horas de cómputo como en Neon (el worker consulta la DB cada 5 min y nunca
# dejaría dormir a Neon).
#
# Uso (desde deploy/oracle/):
#   ./gen-env.sh                 # crea .env con secretos aleatorios
#   nano .env                    # completa DOMAIN, RESEND_API_KEY, ALLOWED_EMAILS
#   docker compose up -d --build

x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  image: openreply:local
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    NEXTAUTH_URL: https://${DOMAIN}
    DATABASE_URL: postgresql://openreply:${POSTGRES_PASSWORD}@postgres:5432/openreply
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    # Las migraciones corren al arrancar (no en el build: ahí la DB no existe).
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      web:
        condition: service_healthy

  cron:
    <<: *app
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://web:3000
    depends_on:
      web:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ exige maxmemory-policy noeviction. AOF para no perder la cola al reiniciar.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

  # pg_dump diario a ./backups, conserva 7 días.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/openreply-$$(date -u +%Y%m%d-%H%M).sql.gz
          if pg_dump -h postgres -U openreply openreply | gzip > "$$f"; then
            echo "[backup] ok $$f"
          else
            echo "[backup] FAILED" >&2; rm -f "$$f"
          fi
          find /backups -name 'openreply-*.sql.gz' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
